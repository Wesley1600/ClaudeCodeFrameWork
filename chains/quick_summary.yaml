# Quick summarization chain (no RAG)
# Demonstrates a simpler 2-step chain

name: quick_summary
description: |
  Simple summarization and reporting chain without retrieval.
  Takes text directly and produces a formatted summary.

initial_data:
  text: |
    Machine learning has revolutionized artificial intelligence by enabling computers
    to learn from data without explicit programming. Deep learning, a subset of machine
    learning, uses neural networks with multiple layers to learn hierarchical representations.
    These networks have achieved remarkable success in image recognition, natural language
    processing, and game playing. Transfer learning allows models pre-trained on large
    datasets to be fine-tuned for specific tasks with less data. Attention mechanisms,
    introduced in the Transformer architecture, have become fundamental to modern NLP
    models like BERT and GPT. Self-supervised learning enables models to learn from
    unlabeled data by predicting parts of the input from other parts. Reinforcement
    learning trains agents to make sequences of decisions by rewarding desired behaviors.
    The field continues to advance rapidly with new architectures and training techniques.

global_config:
  verbose: false

steps:
  - name: "Create Summary"
    skills: summarization
    config:
      summarization:
        strategy: bullet_points
        num_sentences: 5
        compression_ratio: 0.25

  - name: "Format Output"
    skills: reporting
    config:
      reporting:
        format: markdown
        include_metadata: false
        title: "AI/ML Quick Summary"

fail_fast: true
